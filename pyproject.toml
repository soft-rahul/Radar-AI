[project]
name = "shelfradar"
version = "0.1.0"
description = "AI Search Visibility Radar: how often Google AI Overview, AI Mode and Bing Copilot recommend your brand, measured with SerpApi"
readme = "README.md"
authors = [
    { name = "softRahulKeshri", email = "rahul.k@magureinc.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "mcp>=1.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
shelfradar-check = "shelfradar.check:main"
shelfradar-mcp = "shelfradar.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
